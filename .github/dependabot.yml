# Same schedule across Polylang plugins; Dependabot does not sync versions between repos.
# allow — if a package does not match, Dependabot does not open a version PR or a security PR for it.
# groups.build-tools — among packages that already passed allow, matching ones are collapsed into one PR instead of many.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - tests/e2e/**
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    allow:
      - dependency-type: production
      - dependency-name: webpack
      - dependency-name: webpack-cli
      - dependency-name: babel-loader
      - dependency-name: "@wordpress/babel-preset-default"
      - dependency-name: css-loader
      - dependency-name: sass
      - dependency-name: sass-loader
      - dependency-name: postcss
      - dependency-name: mini-css-extract-plugin
      - dependency-name: css-minimizer-webpack-plugin
      - dependency-name: terser-webpack-plugin
      - dependency-name: clean-webpack-plugin
      - dependency-name: copy-webpack-plugin
      - dependency-name: "@wordpress/base-styles"
      - dependency-name: "@wpsyntex/polylang-build-scripts"
      - dependency-name: glob
      - dependency-name: rimraf
    groups:
      build-tools:
        patterns:
          - webpack
          - webpack-cli
          - babel-loader
          - css-loader
          - sass-loader
          - sass
          - postcss
          - mini-css-extract-plugin
          - css-minimizer-webpack-plugin
          - terser-webpack-plugin
          - clean-webpack-plugin
          - copy-webpack-plugin
          - "@wordpress/babel-preset-default"
          - "@wordpress/base-styles"
          - "@wpsyntex/polylang-build-scripts"
          - glob
          - rimraf
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    allow:
      - dependency-type: production
