name: Consistent versions

on:
  push:
    branches: master

  pull_request:
    branches: master

# Cancel superseded PR runs; master commits use unique SHAs so they still all complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event.deleted == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: polylang/actions/consistent-versions@main
        with:
          config: .github/consistent-versions.yaml
          tag-config: .github/consistent-versions-tag.yaml
