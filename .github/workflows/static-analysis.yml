name: Static Analysis

on:
  push:
    branches: master
  pull_request:
    branches: master
  workflow_dispatch:

jobs:
  testing:
    name: PHPCS and PHPStan

    runs-on: ubuntu-latest

    steps:
    - name: Check out the source code
      uses: actions/checkout@v4

    - name: Filter according to modified files
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          php:
            - '**/*.php'

    - name: Run PHPCS and PHPStan tests
      uses: polylang/actions/static-analysis@main
      if: ${{ steps.filter.outputs.php == 'true' }}

    - name: Run PHPCompatibility for files that require php 5.6
      if: ${{ steps.filter.outputs.php == 'true' }}
      run: vendor/bin/phpcs --standard=phpcs-phpcompatibility-56.xml.dist
      shell: bash

  js-and-style:
    name: ESLint

    runs-on: ubuntu-latest

    steps:
    - name: Check out the source code
      uses: actions/checkout@v4

    - name: Filter according to modified files
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          js:
            - 'js/src/blocks/**/*.js'
            - 'tests/e2e/**/*.{js,mjs,cjs}'
            - 'eslint.config.cjs'
            - 'package.json'
            - 'package-lock.json'

    - name: Run ESLint
      uses: polylang/actions/eslint@main
      if: ${{ steps.filter.outputs.js == 'true' }}
      with:
        do-js: true
        js-path: './js/src/blocks ./js/src/nav-menu.js ./tests/e2e'
        do-style: false
